# =============================================================================
# GCP Dev — Deployment patches
# =============================================================================
# 1 replica, minimum resources to keep dev cluster cheap.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{@ service_kebab @}-predictor"
spec:
  replicas: 1
  template:
    spec:
      initContainers:
        - name: model-downloader
          # Image is set by the overlay's `images:` mapping in
          # kustomization.yaml (PR-R2-2). Setting `image:` here would
          # bypass digest pinning enforced by the CI lint.
          command:
            - gsutil
            - cp
            - "gs://{MODEL_BUCKET}/{@ service_kebab @}/model.joblib"
            - /models/model.joblib
          volumeMounts:
            - name: model-storage
              mountPath: /models
      containers:
        - name: "{@ service_kebab @}-predictor"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: MODEL_PATH
              value: /models/model.joblib
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: ENVIRONMENT
              value: "dev"
            # Runtime secret addressing (ADR-051). SECRETS_PREFIX must reproduce
            # Terraform's secret name, <project_name>-<service>-<secret>; replace {PROJECT_NAME}
            # with the Terraform `project_name` variable.
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: SECRETS_PREFIX
              value: "{PROJECT_NAME}-{@ service_kebab @}"
