# =============================================================================
# Kustomize overlay — GCP Dev (GKE)
# =============================================================================
# Smallest footprint: 1 replica, dev-tier resources, baseline PSS.
# Used by .github/workflows/deploy-gcp.yml for auto-deploy on every push to main.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: "{@ service_kebab @}-dev"

resources:
  - ../../base
  - namespace.yaml

images:
  - name: "{@ service_kebab @}-predictor"
    newName: "{REGION}-docker.pkg.dev/{PROJECT_ID}/ml-images/{@ service_kebab @}-predictor"
    newTag: "v1.0.0"
  # Init container CLI — dev tier may use a moving tag; staging/prod must
  # pin by digest (PR-R2-2, ADR-016). The base manifest references this
  # name symbolically; this `newName` rewires it to the real GCP CLI.
  - name: "cloud-cli-image"
    newName: "gcr.io/google.com/cloudsdktool/google-cloud-cli"
    newTag: "slim"

patches:
  - path: patch-deployment.yaml
  - path: patch-serviceaccount.yaml
  - path: patch-serviceaccount-drift.yaml
  # NetworkPolicy egress (May 2026 audit MED-11): see aws-dev/kustomization.yaml.
  - path: patch-networkpolicy.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: "{@ service_kebab @}-network-policy"
  - path: patch-networkpolicy-jobs.yaml
    target:
      kind: NetworkPolicy
      name: "{@ service_kebab @}-jobs-network-policy"
