# =============================================================================
# GCP Production — ServiceAccount with Workload Identity (D-18)
# =============================================================================
# Workload Identity lets K8s pods authenticate to GCP APIs without
# static credentials. The pod's KSA maps to a GCP IAM SA.
#
# Setup (one-time): see docs/runbooks/gcp-wif-setup.md
#
# TODO: Replace {PROJECT_ID} and {PROJECT_NAME} (Terraform project_name). The GSA is the one
# infra/terraform/gcp creates for this environment (ADR-051).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{@ service_kebab @}-sa"
  annotations:
    iam.gke.io/gcp-service-account: "{PROJECT_NAME}-runtime-production@{PROJECT_ID}.iam.gserviceaccount.com"
