# Local profile — no Docker, K8s, Terraform, or cloud credentials required.
# Runs train → serve → drift entirely on a laptop.
# See ADR-033 (Local-first stack profiles).

profile: local

requires:
  docker: false
  kubernetes: false
  terraform: false
  cloud_credentials: false

mlflow:
  # sqlite, not `file://./mlruns` — MLflow 3.x refuses the file store
  # (ADR-047). This was also the one place spelled with a double slash,
  # while every other site used `file:./mlruns`.
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "{@ service_slug @}_local"

serving:
  host: "0.0.0.0"
  port: 8000
  workers: 1

drift:
  schedule: manual

deploy:
  enabled: false
