# pyproject.toml — ML Service Template
# Modern Python project configuration. Use alongside or instead of requirements.txt.
#
# Install: pip install -e ".[dev]"
# Test:    pytest tests/ -v
#
# TODO: Replace {@ service_slug @}, {@ service_name @}, and author info.

[build-system]
requires = ["setuptools >= 84.0.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "{@ service_slug @}"
# Scaffolded services start at 0.1.0 — the template itself is on the v0.x
# hardening line until the first real-cluster L4 evidence lands. Adopters
# bump this independently of the template version.
version = "0.1.0"
description = "{@ service_name @} — ML prediction service"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">= 3.11"
authors = [
    {name = "Your Name", email = "your-email@example.com"},
]

dependencies = [
    # Runtime only — everything the SERVED IMAGE imports, and nothing else.
    # Training extras live in [project.optional-dependencies.train], test and
    # lint tooling in .dev. requirements*.txt is the pip-only export of these
    # three groups (ADR-035 I-035-1) and the template repo's
    # `check_dependency_partition.py` gate keeps them in lockstep.
    # ML Core
    "scikit-learn ~= 1.9.0",
    "pandas ~= 3.0.5",
    "numpy ~= 2.4.6",         # numpy 2.x silently corrupts joblib models
    "scipy ~= 1.17.1",         # champion/challenger significance tests
    "joblib ~= 1.6.0",
    # Serving
    "fastapi ~= 0.141.1",
    "uvicorn ~= 0.52.4",
    "pydantic ~= 2.13.5",
    # Data Validation
    "pandera ~= 0.33.1",
    # Explainability
    "shap ~= 0.51.0",
    # Monitoring
    "prometheus-client ~= 0.26.0",
    "pyarrow ~= 25.0.1",
    "pyyaml ~= 6.0.3",
]

[project.optional-dependencies]
# Offline training pipeline. Deliberately absent from the served image: these
# two carried 20 of the 24 fixable CRITICAL/HIGH advisories this service's
# dependency scan reported, and no code that runs in the image imports them
# (ADR-047, ADR-049).
train = [
    "mlflow ~= 3.16.0",       # ADR-047
    "skops ~= 0.14.0",        # MLflow 3.x sklearn serialiser; imported by train.py
    "optuna ~= 5.0.0",
    # "imbalanced-learn ~= 0.12.0",  # optional: SMOTE / undersampling
]

dev = [
    "pytest ~= 9.1.1",
    "pytest-cov ~= 7.1.0",
    "locust ~= 2.46.5",
    "httpx ~= 0.28.1",
    "jsonschema ~= 4.26.0",
    # ADR-044 replaced black + isort + flake8 with ruff. All three stayed
    # declared here, so every generated service installed three linters it
    # never runs — and did not declare the one it does. Dependabot noticed
    # before we did: it opened a PR bumping flake8.
    "ruff ~= 0.16.6",
    "mypy ~= 2.3.1",
    "bandit ~= 1.9.4",
    "pre-commit ~= 4.6.2",
]

# Optional heavy ML dependencies — uncomment if needed
# xgboost = ["xgboost ~= 2.1.0"]
# lightgbm = ["lightgbm ~= 4.5.0"]

# ── Ruff: lint + format, replacing black + isort + flake8 (ADR-044) ──────────
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".venv", "data", "models", "mlruns", "__pycache__"]

[tool.ruff.lint]
# Parity scope with the black+isort+flake8 setup this replaces.
select = ["E", "W", "F", "I"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["app", "common_utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --import-mode=importlib: three sibling test packages are all named `tests`
# (tests/, eda/tests/, monitoring/tests/); the default `prepend` mode
# collides in sys.modules when more than one is collected in the same run
# (AUDIT R8-05 — same fix as the template-repo root pyproject). Verified:
# no test imports `from tests…`, so importlib is safe here and in
# scaffolded services.
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = [".", "src"]
markers = [
    "scaffold_context: needs a scaffolded service (data/ dirs, generated openapi snapshot, trained model); excluded from the template-context CI lane and exercised by the scaffold smoke instead",
    "locust_parity: imports locust, whose gevent monkey-patch deadlocks anyio TestClient lifespans in the same process; always run in a dedicated pytest invocation",
]
