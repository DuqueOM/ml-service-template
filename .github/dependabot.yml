# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # GitHub Actions — the SHIPPED workflows.
  #
  # `directory:` is resolved literally, so the entry above covers only
  # `.github/workflows/` at the repo root. The nine workflows under
  # `templates/service/.github/workflows/` were never scanned, which is the
  # same blind spot documented for terraform below — and it had a second
  # effect: `check_cicd_template_drift.py` requires the runtime and template
  # copies to pin identical versions, so every action bump Dependabot opened
  # was HALF a change and failed that gate by construction. Scanning both
  # directories lets one PR satisfy it.
  - package-ecosystem: "github-actions"
    directory: "/templates/service"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # ---------------------------------------------------------------------
  # Python (pip).
  #
  # This was ABSENT while the repository carried four requirements files and
  # two pyproject.toml files. The consequence was not theoretical: with pip
  # unwatched, GitHub's dependency graph never opened an update PR for
  # scikit-learn, fastapi, mlflow or anything else, and the one CI control
  # that was meant to catch vulnerable versions — the Trivy filesystem scan —
  # had never examined a dependency either (it cannot read `~=` pins). Three
  # nominal controls over Python dependencies, all inert at once.
  #
  # `directory:` is resolved LITERALLY, exactly as for terraform above, and a
  # requirements file in an unlisted directory is simply unwatched. That risk
  # was written here and enforced by nothing; it now is —
  # `scripts/check_dependency_pin_coherence.py` fails when any tracked
  # requirements file sits outside every pip entry's directories. `directories:`
  # (plural) covers a subtree's worth of files in one entry, which is how the
  # service and its EDA lane share one grouped PR below.
  # ---------------------------------------------------------------------

  # Python — the shipped service, ALL of its requirements files in one entry.
  #
  # `directories:` (plural) rather than one entry per file, plus a group, so a
  # package declared in more than one of them bumps in ONE pull request.
  # Separate entries produced separate PRs, and the pin-coherence gate
  # (ADR-048) rejects each of them on its own: #148 raised pandas only in the
  # EDA lane and #152 only pyarrow, and both failed with
  #
  #     group 'generated-service' disagrees on 'pyarrow':
  #       ~=25.0.1   templates/service/eda/requirements.txt
  #       ~=18.0.0   templates/service/requirements.txt
  #
  # which is the gate doing its job on a PR that could never have been
  # mergeable. Grouping is how the bump arrives in a shape that can pass.
  #
  # `versioning-strategy: increase` is the other half. The pip default is
  # `widen`, which rewrites `~= 1.5.0` as `>=1.5,<1.10` — and this repository
  # mandates compatible-release pins (D-05: numpy 2.x silently corrupts joblib
  # models). Five such PRs were opened and closed unmerged (#130, #132, #133,
  # #134, #136) before anyone looked at why they kept arriving. `increase`
  # bumps the pin in place, `~= 1.5.0` -> `~= 1.9.0`, which is reviewable
  # rather than automatically wrong.
  - package-ecosystem: "pip"
    directories:
      - "/templates/service"
      - "/templates/service/eda"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      service-python:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  # Python — the working example an adopter runs first
  - package-ecosystem: "pip"
    directory: "/examples/minimal"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  # Python — this repository's own tooling (root pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"

  # Docker (service template)
  - package-ecosystem: "docker"
    directory: "/templates/service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Ignore Python 3.14+ (pre-release/development versions)
      - dependency-name: "python"
        versions: [">=3.14"]

  # Terraform (GCP)
  - package-ecosystem: "terraform"
    directory: "/templates/service/infra/terraform/gcp"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "terraform"

  # Terraform (AWS)
  - package-ecosystem: "terraform"
    directory: "/templates/service/infra/terraform/aws"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "terraform"

  # ---------------------------------------------------------------------
  # Bootstrap + edge layers.
  #
  # Dependabot resolves `directory:` literally — it does NOT recurse into
  # subdirectories. The two entries above therefore cover only the live
  # layers; `gcp/bootstrap`, `aws/bootstrap` and `cloudflare` are separate
  # root modules with their own `required_providers` blocks and were
  # ageing silently (google was three majors behind the live layer before
  # this entry existed). Same blind-spot class the CI/CD Template Drift
  # Gate was built to catch — see docs/governance/cicd-templates-drift.md.
  #
  # The bootstrap layers are provisioned once per (project, environment)
  # and touched roughly annually (ADR-015 PR-A2), which is precisely why
  # they need automated bumps: nobody revisits them by hand.
  # ---------------------------------------------------------------------

  # Terraform (GCP bootstrap — state bucket, KMS, Artifact Registry)
  - package-ecosystem: "terraform"
    directory: "/templates/service/infra/terraform/gcp/bootstrap"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "terraform"

  # Terraform (AWS bootstrap — state bucket, DynamoDB lock table, KMS, ECR)
  - package-ecosystem: "terraform"
    directory: "/templates/service/infra/terraform/aws/bootstrap"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "terraform"

  # Terraform (Cloudflare edge protection — ADR-042 / D-38)
  - package-ecosystem: "terraform"
    directory: "/templates/service/infra/terraform/cloudflare"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "terraform"
