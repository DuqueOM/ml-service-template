# OpenSSF Scorecard — supply-chain posture, scored and published (AUDIT R9-01).
#
# Why this exists: the template already does what Scorecard measures (Cosign
# signing, SBOM attestation, branch protection, gitleaks) — but an enterprise
# evaluator's first move is checking for the badge, not reading the repo.
# Publishing the score turns "trust us" into "verify us."
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC — Scorecard's own cadence guidance
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results to the public Scorecard API
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # required for the README badge to resolve

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
