---
# Auto-publish a GitHub Release whenever a new `v*` tag is pushed.
#
# External-feedback triage gap 3.1 (May 2026):
# tags existed (v1.0.0..v1.12.0, v0.13.0, v0.14.0) but several of
# the recent ones never became GitHub Releases. The CHANGELOG.md is
# 1,400+ lines yet invisible to anyone using GitHub's Releases UI,
# producing the "no releases = abandoned" perception.
#
# Fixed 2026-07-01 (rule 16 / ADR-031 incident): the first version of
# this workflow only extracted from CHANGELOG.md with a regex that
# assumed the heading format `## [X.Y.Z] - YYYY-MM-DD` (no leading `v`
# inside the brackets, hyphen separator). Once CHANGELOG.md headings
# moved to `## [vX.Y.Z] — YYYY-MM-DD` (leading `v`, em-dash) starting at
# v0.19.0, the regex silently stopped matching and every release fell
# back to the generic "Auto-published from tag" body — requiring manual
# `gh release edit` to fix, exactly the manual-intervention failure mode
# this workflow exists to eliminate. Fixed by:
#   1. Preferring `releases/vX.Y.Z.md` (title = its H1, body = the full
#      file) as the primary source — it is the polished, human-authored
#      release note `docs/RELEASING.md` already requires for every
#      non-hotfix release.
#   2. A CHANGELOG.md fallback regex tolerant of both heading formats.
#   3. Idempotent create-or-edit (a re-run, or a release someone already
#      touched, no longer fails the job).
#   4. Explicit, computed `--latest` for the newest tag on the active
#      v0.x line — never flagged `--prerelease`. An earlier draft of
#      this fix tried flagging every 0.x tag as a GitHub "prerelease" to
#      signal the pre-GA hardening channel (docs/RELEASING.md §2).
#      Verified empirically against the real API: a `--prerelease`
#      release is **structurally excluded** from ever being "Latest" —
#      `--latest` on a prerelease is silently dropped, and the badge
#      falls back to the newest non-prerelease release instead (which
#      may be an old 0.x tag, or a frozen v1.x historical snapshot).
#      That is a materially worse outcome than the semantic-purity of
#      the prerelease flag: a visitor would see a stale "Latest release"
#      pointing at a genuinely older cut. The pre-GA nuance is
#      communicated in prose instead (this repo already does that
#      consistently — docs/RELEASING.md, every releases/vX.Y.Z.md, and
#      README's verification-status section all say so explicitly),
#      not via a UI flag with this side effect. Matches the observed,
#      100%-consistent history: every release ever published in this
#      repo (v1.1.0 through v0.19.0) has `prerelease=false`.
#
# Mode (per AGENTS.md): AUTO. Releases are additive and reversible
# (a Release can be deleted without affecting tags or the repo).

name: Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required for `gh release create` / `gh release edit`

jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history + tags — required for the --latest comparison below

      - name: Build release title + body
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          note_file="releases/${TAG}.md"

          if [ -f "$note_file" ]; then
            echo "Using release note: ${note_file}"
            title="$(grep -m1 '^# ' "$note_file" | sed -E 's/^# +//')"
            cp "$note_file" /tmp/release-body.md
          else
            # Tolerant of both heading conventions ever used in this repo:
            #   ## [0.18.0] - 2026-06-10      (no leading v, hyphen)
            #   ## [v0.20.0] — 2026-07-01     (leading v, em-dash)
            if grep -qE "^## \[v?${version}\] " CHANGELOG.md; then
              echo "No ${note_file}; extracting CHANGELOG.md section for ${TAG}."
              title="${TAG}"
              awk -v v="${version}" '
                $0 ~ ("^## \\[v?" v "\\] ") {capture=1; next}
                capture && /^## \[/ {capture=0}
                capture {print}
              ' CHANGELOG.md > /tmp/release-body.md
            else
              echo "No ${note_file} and no matching CHANGELOG.md section; using generic body."
              title="${TAG}"
              cat > /tmp/release-body.md <<'EOF'
          Auto-published from tag. See `CHANGELOG.md` for the full change list.
          EOF
            fi
          fi

          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: Determine latest flag
        id: flags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Never --prerelease (see the file header — it structurally
          # breaks --latest on the GitHub API). "Latest" tracks the
          # newest tag on the ACTIVE v0.x line; the frozen v1.x
          # historical snapshots (docs/RELEASING.md §2) never compete
          # for it. A future real v1.x GA cut (not one of the existing
          # frozen snapshots) becomes latest unconditionally.
          if [[ "${TAG}" =~ ^v0\. ]]; then
            highest_v0="$(git tag --list 'v0.*' | sort -V | tail -1)"
            if [ "${TAG}" = "${highest_v0}" ]; then
              echo "latest=--latest" >> "$GITHUB_OUTPUT"
            else
              echo "latest=--latest=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "latest=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.release.outputs.title }}
          LATEST: ${{ steps.flags.outputs.latest }}
        run: |
          set -eu
          # Idempotent: a re-run of this workflow, or a release someone
          # already touched by hand, updates in place instead of failing
          # on "release already exists".
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — updating."
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file /tmp/release-body.md \
              --prerelease=false \
              ${LATEST}
          else
            echo "Release ${TAG} does not exist — creating."
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file /tmp/release-body.md \
              --verify-tag \
              ${LATEST}
          fi

  # Supply-chain evidence for the TEMPLATE's own release artifact
  # (AUDIT R11 M-2). Scaffolded services already ship SBOM + Cosign
  # signatures for their images (templates/service ci.yml); this job
  # closes the same gap for the template source itself:
  #   1. Deterministic source tarball via `git archive` at the tag.
  #   2. Source SBOM in CycloneDX + SPDX (syft dir scan).
  #   3. Keyless Sigstore signature over the checksum manifest
  #      (cosign sign-blob, GitHub OIDC identity — same trust root as
  #      the service image signing chain, no long-lived keys).
  # Verification (any consumer):
  #   cosign verify-blob --bundle checksums.txt.sigstore.json \
  #     --certificate-identity-regexp 'github.com/.+/release-on-tag' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     checksums.txt
  supply-chain-evidence:
    name: Source SBOM + Sigstore provenance
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # `gh release upload`
      id-token: write   # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.0

      - name: Build source tarball + SBOMs + checksum manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p /tmp/evidence
          git archive --format=tar.gz \
            --prefix="ml-mlops-template-${TAG}/" \
            -o "/tmp/evidence/source-${TAG}.tar.gz" "${TAG}"
          syft dir:. -o cyclonedx-json > "/tmp/evidence/sbom-${TAG}.cyclonedx.json"
          syft dir:. -o spdx-json      > "/tmp/evidence/sbom-${TAG}.spdx.json"
          # Hash into a path OUTSIDE the globbed dir first — a redirect
          # target inside it would be created (empty) before the glob
          # expands and end up hashing itself.
          (cd /tmp/evidence && sha256sum ./*) > /tmp/checksums.txt
          mv /tmp/checksums.txt /tmp/evidence/checksums.txt

      - name: Sign checksum manifest (keyless)
        run: |
          set -eu
          cosign sign-blob --yes \
            --bundle /tmp/evidence/checksums.txt.sigstore.json \
            /tmp/evidence/checksums.txt

      - name: Attach evidence to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release upload "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            /tmp/evidence/*
