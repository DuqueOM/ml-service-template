# =============================================================================
# Policy Tests — D-XX anti-patterns enforced on SCAFFOLDED output.
#
# Authority: ADR-016 PR-R2-11.
#
# This workflow runs the `templates/service/tests/policy/` suite, which
# scaffolds a fresh service via `templates/scripts/new-service.sh` and then
# asserts that AGENTS.md D-01..D-32 invariants hold on the rendered output.
#
# Why a dedicated workflow (not part of the regular test job):
#   - Each scaffold takes ~45s + tests take ~4-5 min total
#   - The signal is "do scaffolded users get a compliant repo?" — a
#     per-PR gate is overkill; weekly + on-demand is sufficient
#   - When this fails, it ALWAYS surfaces a real template drift, never
#     a flake (the suite is fully deterministic)
#
# Triggers:
#   - schedule: every Monday 06:00 UTC (catches drift introduced over
#     the previous week's PRs)
#   - workflow_dispatch: on-demand from the Actions tab
#   - push to main (informational only — the regular CI gate already
#     ran the cheap contract tests)
# =============================================================================

name: Policy Tests (D-XX anti-patterns)

on:
  schedule:
    # Mondays 06:00 UTC — early enough that drift from weekend merges
    # is reported before the team starts the new week.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "templates/scripts/new-service.sh"
      - "templates/service/tests/policy/**"
      - "templates/service/k8s/**"
      - "templates/k8s/policies/**"
      - "templates/service/infra/terraform/**"
      - "templates/service/Dockerfile"
      - "templates/service/requirements*.txt"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  policy-tests:
    name: Run policy suite over scaffolded output
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Policy suite needs pytest + pyyaml for YAML parsing, plus
          # copier + jsonschema because the conftest fixture scaffolds a
          # service via new-service.sh (Copier wrapper) with post-gen
          # validation that requires jsonschema.
          pip install pytest pyyaml "copier>=9.0.0" jsonschema

      - name: Run policy suite
        run: |
          # --rootdir: pytest treats policy/ as the project root, so it
          #   does NOT walk up and load templates/service/tests/conftest.py
          # --confcutdir: hard cap on conftest discovery — never above
          #   policy/'s own conftest.py
          # -p no:cacheprovider: workflow is ephemeral, no cache to keep
          # -o addopts="": override the cov defaults inherited from
          #   templates/service/pyproject.toml (workflow doesn't
          #   install pytest-cov so --no-cov would also be unknown).
          python -m pytest templates/service/tests/policy/ \
            --rootdir=templates/service/tests/policy \
            --confcutdir=templates/service/tests/policy \
            -o addopts="" \
            -v -p no:cacheprovider \
            --tb=short --color=no

      - name: Summary
        if: always()
        run: |
          echo "## Policy test result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Suite scaffolds a service via \`new-service.sh\` and asserts" >> $GITHUB_STEP_SUMMARY
          echo "AGENTS.md D-01..D-32 invariants hold on the rendered output." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If FAILED: a template change caused drift between the" >> $GITHUB_STEP_SUMMARY
          echo "documented invariants and what users actually receive." >> $GITHUB_STEP_SUMMARY
